name: hubdesk

services:
  api:
    build:
      context: .
      target: production
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://hubdesk:hubdesk@db:5432/hubdesk?schema=public
      JWT_SECRET: change-me-in-production
      UPLOADS_DIR: uploads
    volumes:
      - hubdesk_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hubdesk
      POSTGRES_PASSWORD: hubdesk
      POSTGRES_DB: hubdesk
    ports:
      - '5432:5432'
    volumes:
      - hubdesk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hubdesk']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hubdesk_db_data:
  hubdesk_uploads:
