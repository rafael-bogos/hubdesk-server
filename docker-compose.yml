name: hubdesk

services:
  api:
    build:
      context: .
      target: production
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://hubdesk:hubdesk@db:5432/hubdesk?schema=public
      JWT_SECRET: change-me-in-production
      UPLOADS_DIR: uploads
      REDIS_URL: redis://redis:6379
      # Opcionais — defina num arquivo `.env` ao lado deste compose para customizar
      # o admin criado pelo seed na primeira subida (veja .env.example).
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - hubdesk_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hubdesk
      POSTGRES_PASSWORD: hubdesk
      POSTGRES_DB: hubdesk
    ports:
      - '5432:5432'
    volumes:
      - hubdesk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hubdesk']
      interval: 10s
      timeout: 5s
      retries: 5

  # Fila do BullMQ (fechamento automático de chamados PENDING_CLOSURE).
  redis:
    image: redis:7-alpine
    volumes:
      - hubdesk_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hubdesk_db_data:
  hubdesk_uploads:
  hubdesk_redis_data:
