name: hubdesk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hubdesk
      POSTGRES_PASSWORD: hubdesk
      POSTGRES_DB: hubdesk
    ports:
      - '5432:5432'
    volumes:
      - hubdesk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hubdesk']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hubdesk_db_data:
