name: hubdesk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hubdesk
      POSTGRES_PASSWORD: hubdesk
      POSTGRES_DB: hubdesk
    ports:
      - '5433:5432'
    volumes:
      - hubdesk_db_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hubdesk']
      interval: 10s
      timeout: 5s
      retries: 5

  # Fila do BullMQ (fechamento automático de chamados PENDING_CLOSURE) — porta
  # própria (6381) pra não colidir com outro Redis que já esteja rodando na
  # máquina do dev.
  redis:
    image: redis:7-alpine
    ports:
      - '6381:6379'
    volumes:
      - hubdesk_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hubdesk_db_data:
  hubdesk_redis_data:
